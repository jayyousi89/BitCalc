<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>BitCalc — الأسعار</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>BitCalc</h1>
    <nav>
      <a href="index.html">الرئيسية</a>
      <a href="tools.html">الأدوات</a>
      <a href="prices.html">الأسعار</a>
      <a href="blog.html">المدونة</a>
      <a href="premium.html">الاشتراك</a>
    </nav>
  </header>

  <main>
    <h2>أسعار العملات الرقمية (تحديث مباشر)</h2>
    <table>
      <tr><th>العملة</th><th>السعر</th><th>التغيير (24h)</th></tr>
      <tr><td>Bitcoin (BTC)</td><td id="btc-price">--</td><td id="btc-change">--</td></tr>
      <tr><td>Ethereum (ETH)</td><td id="eth-price">--</td><td id="eth-change">--</td></tr>
      <tr><td>Solana (SOL)</td><td id="sol-price">--</td><td id="sol-change">--</td></tr>
    </table>
    <button onclick="fetchPrices()">تحديث الآن</button>
  </main>

  <footer>
    <p>© 2026 BitCalc</p>
  </footer>

  <script>
    async function fetchPrices() {
      try {
        const response = await fetch("https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true");
        const data = await response.json();

        document.getElementById("btc-price").textContent = data.bitcoin.usd + " $";
        document.getElementById("btc-change").textContent = data.bitcoin.usd_24h_change.toFixed(2) + "%";

        document.getElementById("eth-price").textContent = data.ethereum.usd + " $";
        document.getElementById("eth-change").textContent = data.ethereum.usd_24h_change.toFixed(2) + "%";

        document.getElementById("sol-price").textContent = data.solana.usd + " $";
        document.getElementById("sol-change").textContent = data.solana.usd_24h_change.toFixed(2) + "%";
      } catch (error) {
        console.error("خطأ في جلب الأسعار:", error);
      }
    }

    // تحديث تلقائي كل 30 ثانية
    fetchPrices();
    setInterval(fetchPrices, 30000);
  </script>
</body>
</html>
